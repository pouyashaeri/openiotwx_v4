# Checks every change, and on main builds the container image and publishes it.
#
# The image goes to GitHub's container registry (ghcr.io) by default. To use another registry, set the repository
# variable IMAGE_REPO (Settings, Secrets and variables, Variables) to its full name, for example
# registry.example.org/openiotwx/app, and add REGISTRY_USERNAME / REGISTRY_PASSWORD secrets (see the login step).
#
# Images are tagged with the commit that built them and never "latest", so a deployment always says exactly what it runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        # Informational for now: one advisory (better-auth rate limits stored in a database) does not apply to how this
        # site runs, and clearing it needs a major upgrade. The report is still printed. See docs/DEPLOY.md, "Known limits".
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  gateway:
    name: Raspberry Pi gateway tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest pi_gateway/test_pi_gateway.py -v

  manifests:
    name: Kubernetes files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # kubectl is on the runner; its built-in kustomize renders the overlays.
      - run: kubectl version --client
      - run: node scripts/check-manifests.mjs

  image:
    name: Build, scan and publish the image
    needs: [test, gateway, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ vars.IMAGE_REPO != '' && vars.IMAGE_REPO || format('ghcr.io/{0}/openiotwxng', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build once, load it locally, and look for known vulnerabilities before anything is published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Only commits on main are published, never pull requests.
      - name: Work out the registry from the image name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # ghcr.io/ncar/openiotwxng -> ghcr.io. (GitHub expressions have no string-splitting function, so the shell does it.)
        run: echo "REGISTRY=${IMAGE%%/*}" >> "$GITHUB_ENV"
      - name: Log in to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD != '' && secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          echo "Published $IMAGE:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy it by setting newTag to \`${{ github.sha }}\` in the overlay (deploy/k8s/overlays/...)." >> "$GITHUB_STEP_SUMMARY"
