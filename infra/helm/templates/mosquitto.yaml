apiVersion: v1
kind: ConfigMap
metadata: { name: mosquitto-config }
data:
  mosquitto.conf: |-
{{ .Files.Get "files/mosquitto.conf" | default "listener 1883\nallow_anonymous true\nlistener 9001\nprotocol websockets\nallow_anonymous true" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mosquitto }
spec:
  replicas: 1
  selector: { matchLabels: { app: mosquitto } }
  template:
    metadata: { labels: { app: mosquitto } }
    spec:
      containers:
        - name: mosquitto
          image: {{ .Values.mosquitto.image }}
          ports: [{ containerPort: 1883 }, { containerPort: 9001 }]
          volumeMounts: [{ name: config, mountPath: /mosquitto/config/mosquitto.conf, subPath: mosquitto.conf }]
      volumes: [{ name: config, configMap: { name: mosquitto-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: mosquitto }
spec:
  type: {{ if .Values.mosquitto.exposeMqtt }}LoadBalancer{{ else }}ClusterIP{{ end }}
  selector: { app: mosquitto }
  ports:
    - { name: mqtt, port: {{ .Values.mosquitto.mqttPort }}, targetPort: 1883 }
    - { name: ws, port: {{ .Values.mosquitto.wsPort }}, targetPort: 9001 }
