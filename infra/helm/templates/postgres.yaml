apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.postgres.storage }} } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init }
data:
  init.sql: |-
{{ .Files.Get "files/init.sql" | default "-- copy infra/db/init.sql here before packaging" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.db | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.passwordSecret }}, key: password } }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: postgres-data } }
        - { name: init, configMap: { name: postgres-init } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
