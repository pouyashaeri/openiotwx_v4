# Stations connect on 1883; the browser live feed connects on 9001 over WebSockets.
# Anonymous access is fine on a LAN. For a public host, set allow_anonymous false and add a
# password_file (mosquitto_passwd -c /mosquitto/config/passwd station).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
