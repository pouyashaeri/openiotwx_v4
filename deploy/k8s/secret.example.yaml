# The Secret the app and the migration job read. THIS FILE IS A TEMPLATE: it is not part of any kustomization and
# must never hold real values in git. Create the real Secret some other way (kubectl, sealed-secrets, external-secrets,
# whatever the cluster uses), with the same name and keys:
#
#   kubectl -n <namespace> create secret generic openiotwx \
#     --from-literal=DATABASE_URL='postgres://USER:PASSWORD@HOST:5432/DBNAME' \
#     --from-literal=BETTER_AUTH_SECRET="$(openssl rand -base64 48)"
#
# The database must be UTF-8. TimescaleDB is optional.
apiVersion: v1
kind: Secret
metadata:
  name: openiotwx
type: Opaque
stringData:
  # Required. The production server refuses to start without them.
  DATABASE_URL: postgres://USER:PASSWORD@HOST:5432/DBNAME
  BETTER_AUTH_SECRET: at-least-32-random-characters-long-and-not-an-example
  # Optional. Leave a key out to switch the feature off. Tokens must be at least 24 characters.
  # HUB_TOKEN: ...            # lets a forecast runner write forecasts and run status
  # INGEST_BRIDGE_TOKEN: ...  # lets an MQTT bridge post readings
  # GDEX_RELEASE_TOKEN: ...   # lets a scheduler build the monthly GDEX release
  # SMTP_URL: smtp://user:password@host:587    # support email
  # ANTHROPIC_API_KEY: ...    # the chat's language model (or set CHAT_LLM_ENDPOINT in the ConfigMap instead)
  # CHAT_LLM_KEY: ...
