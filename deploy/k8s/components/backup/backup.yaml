# OPTIONAL: a nightly database dump kept for 14 days on its own volume (custom format, restorable with pg_restore).
# Works against any Postgres the app uses, because it reads the same DATABASE_URL. Use the same major version as the
# server for pg_dump (change the image in the overlay if the server is not version 16).
#
# Restore:   pg_restore --clean --if-exists --no-owner -d "$DATABASE_URL" openiotwx-YYYYmmdd-HHMMSS.dump
# With TimescaleDB, wrap the restore in timescaledb_pre_restore() / timescaledb_post_restore() (see the Timescale docs).
# A dump on the same cluster does not protect against losing the cluster: copy the dumps somewhere else too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openiotwx-backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openiotwx
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  file="/backups/openiotwx-$(date -u +%Y%m%d-%H%M%S).dump"
                  pg_dump --format=custom --no-owner --file="$file" "$DATABASE_URL"
                  # A dump that cannot be read back is not a backup: check it before keeping it.
                  pg_restore --list "$file" > /dev/null
                  echo "wrote $file ($(wc -c < "$file") bytes)"
                  find /backups -name 'openiotwx-*.dump' -mtime +14 -delete
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: openiotwx, key: DATABASE_URL } }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: backups, mountPath: /backups }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: openiotwx-backups
            - name: tmp
              emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openiotwx-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
