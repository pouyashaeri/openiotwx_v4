# Applies migrations/*.sql, once each, before a new version starts. Safe to run again (it records what it applied).
#
# With Argo CD this runs as a PreSync hook: before the new Deployment is rolled out, and the old Job is replaced.
# With plain `kubectl apply`, a finished Job cannot be changed, so delete it first:
#   kubectl delete job openiotwx-migrate --ignore-not-found
apiVersion: batch/v1
kind: Job
metadata:
  name: openiotwx-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6 # the database may still be starting; each retry waits a little longer
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openiotwx
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: openiotwx
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: openiotwx-app # the same image as the app, so the migrations always match the code
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/migrate.mjs"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: openiotwx, key: DATABASE_URL } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
